          pattern: '^[a-fA-F0-9]{24}$'
        sectionId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        title:
          type: string
        position:
          type: integer
          minimum: 0
        isPreview:
          type: boolean
        videoStatus:
          type: string
          enum: [none, pending, processing, ready, failed]
        durationSeconds:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Section:
      type: object
      required: [id, courseId, title, position, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        courseId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        title:
          type: string
        position:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CurriculumSection:
      type: object
      required: [id, courseId, title, position, createdAt, updatedAt, lessons]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        courseId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        title:
          type: string
        position:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    SectionResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [section]
          additionalProperties: false
          properties:
            section:
              $ref: '#/components/schemas/Section'
    LessonResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [lesson]
          additionalProperties: false
          properties:
            lesson:
              $ref: '#/components/schemas/Lesson'
    SectionListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [sections]
          additionalProperties: false
          properties:
            sections:
              type: array
              items:
                $ref: '#/components/schemas/Section'
    LessonListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [lessons]
          additionalProperties: false
          properties:
            lessons:
              type: array
              items:
                $ref: '#/components/schemas/Lesson'
    CurriculumResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [sections]
          additionalProperties: false
          properties:
            sections:
              type: array
              items:
                $ref: '#/components/schemas/CurriculumSection'
    DeleteResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [deletedId]
          additionalProperties: false
          properties:
            deletedId:
              type: string
              pattern: '^[a-fA-F0-9]{24}$'
    VideoUploadResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [upload]
          additionalProperties: false
          properties:
            upload:
              type: object
              required: [id, url, timeoutSeconds, videoStatus]
              additionalProperties: false
              properties:
                id:
                  type: string
                url:
                  type: string
                  format: uri
                  description: Temporary Mux Direct Upload URL. Do not persist or log it.
                timeoutSeconds:
                  type: integer
                  minimum: 60
                  maximum: 604800
                videoStatus:
                  const: pending
    VideoWebhookResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [received, handled]
          additionalProperties: false
          properties:
            received:
              const: true
            handled:
              type: boolean
              description: False for authentic unrelated, unknown, or obsolete events.
    RegistrationResponse:
      type: object
      example:
        data:
          user:
            id: 507f1f77bcf86cd799439011
            name: Frontend Tester
            email: student@example.com
            roles: [student]
            emailVerifiedAt: null
        message: Registration successful. Check your email to verify your account
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [user]
          additionalProperties: false
          properties:
            user:
              $ref: '#/components/schemas/PublicUser'
        message:
          type: string
    VerificationResponse:
      type: object
      example:
        data:
          verified: true
        message: Email address verified successfully
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [verified]
          additionalProperties: false
          properties:
            verified:
              const: true
        message:
          type: string
    GenericAcceptedResponse:
      type: object
      example:
        data: {}
        message: If the account exists and still needs verification, a verification email will be sent
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
        message:
          type: string
    PasswordResetAcceptedResponse:
      type: object
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
        message:
          type: string
          example: If the account exists, a password reset email will be sent
    PasswordResetResponse:
      type: object
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [passwordReset]
          additionalProperties: false
          properties:
            passwordReset:
              const: true
        message:
          type: string
    LoginResponse:
      type: object
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [accessToken, expiresInSeconds, user]
          additionalProperties: false
          properties:
            accessToken:
              type: string
              readOnly: true
            expiresInSeconds:
              const: 900
            user:
              $ref: '#/components/schemas/PublicUser'
        message:
          type: string
    AccessTokenResponse:
      type: object
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [accessToken, expiresInSeconds]
          additionalProperties: false
          properties:
            accessToken:
              type: string
              readOnly: true
            expiresInSeconds:
              const: 900
        message:
          type: string
    EmptySuccessResponse:
      type: object
      required: [data, message]
      additionalProperties: false
      properties:
        data:
          type: object
