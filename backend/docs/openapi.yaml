openapi: 3.1.0
info:
  title: E-Learning Marketplace API
  version: 1.0.0
  description: |
    Stories 1.1 through 2.4: foundation, registration/email verification,
    session management, secure password reset, basic user profiles, and
    instructor applications with administrative review, draft courses, ordered curricula,
    secure Mux direct-video uploads with signed webhook processing, and Sprint 2 content
    fields, reviewed instructor links, and public instructor profiles.
    S2-03 adds signed Cloudinary upload intents, provider-verified confirmation,
    and asynchronous media deletion for avatars, draft covers, and one lesson PDF.
    S2-04 adds public active-category discovery and admin create, edit, archive,
    and reactivate operations. Archived categories keep existing course references.
    S2-05 adds course submission, administrative review and publication with
    readiness checks, rejection reasons, and audit events.
    S2-06 adds public published-course catalog and details with prefix title search.
    S2-07 adds Stripe Test Checkout with immutable financial snapshots.
    S2-08 adds a signed durable payment inbox and atomic payment/enrollment/earnings fulfillment.
    S2-09 adds free enrollment, the owner's library/learning outline, owner-only order polling,
    and admin order reads. S2-10 adds authorized signed video playback and temporary private PDF downloads.
    S2-11 adds enrollment-bound lesson completion/resume and dynamic progress reads.
    Refunds and payouts remain later stories.
    Register with a mailbox you control, copy the token from the verification email,
    then POST it to /auth/verify-email. Tokens expire after 24 hours.
    Resend returns 202 when the request is queued, not when email arrives.
    A registration 503 EMAIL_DELIVERY_UNAVAILABLE means the account was created but delivery failed;
    offer resend instead of registering it again. All errors use the shared error envelope.
    Login, refresh, and logout require an allowed Origin, or Referer when Origin is absent.
    CLI clients must send an allowed Origin explicitly. Configure the local Swagger origin too.
    Coordinate refresh requests; simultaneous reuse revokes the device family and its access tokens.
    Forgot-password always returns the same accepted response. Reset links expire after 30 minutes,
    work once, and invalidate all existing sessions after a successful password change.
servers:
  - url: /api/v1
    description: API on the same host as this documentation
tags:
  - name: Health
    description: Process health
  - name: Auth
    description: Registration, email verification, session management, and password reset
  - name: Users
    description: Authenticated user profile
  - name: Instructor applications
    description: Student applications and administrative review
  - name: Instructors
    description: Public approved-instructor profiles and owner-managed profile details
  - name: Instructor courses
    description: Instructor-owned course creation, reads, and draft editing
  - name: Course review
    description: Instructor submissions and administrative publication decisions
  - name: Catalog
    description: Public published-course discovery and safe curriculum summaries
  - name: Checkout
    description: Stripe Test hosted checkout and durable verified payment fulfillment
  - name: Learning library
    description: Free enrollment, student-owned learning outlines and dynamic progress reads
  - name: Learning access
    description: Signed video playback and authorized temporary PDF downloads
  - name: Learning progress
    description: Enrollment-bound lesson completion and resume position
  - name: Orders
    description: Read-only student order history/polling and administrator financial snapshots
  - name: Curriculum
    description: Ordered sections and lessons belonging to instructor-owned draft courses
  - name: Video
    description: Mux Direct Upload creation and signed asynchronous lifecycle events
  - name: Media
    description: Cloudinary direct uploads, confirmation, and deletion
  - name: Categories
    description: Public category discovery and administrative category management
paths:
  /users/me/courses/{courseId}/lessons/{lessonId}/progress:
    put:
      operationId: setLessonCompletion
      tags: [Learning progress]
      summary: Set or clear completion of an enrolled course lesson
      description: |
        Requires a current verified active student session and active enrollment in a published
        course. Preview/owner/admin review access grants no progress-write exemption.
        completed must be a real boolean; no query parameters are accepted. Repeated true
        preserves the original completion timestamp; false clears it. Resume position is
        updated only by the separate last-lesson endpoint. Progress is self-reported, not
        server proof of viewing video. The course percentage uses its current existing lessons,
        excludes orphan/foreign progress, and floors to two decimals (zero lessons is 0%).
        Completion/resume share a user-wide quota of 60/min across all courses/lessons.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CourseId' }
        - { $ref: '#/components/parameters/LessonId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        '200':
          description: Current lesson and course progress saved atomically
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /users/me/courses/{courseId}/last-lesson:
    put:
      operationId: setLastLearningLesson
      tags: [Learning progress]
      summary: Save the enrolled student's resume lesson
      description: |
        Requires a verified active student, live session, active enrollment and published
        course. The lesson must still exist in this exact course. No query parameters or
        client-selected enrollment/student/timestamps are accepted. Repeated requests are
        idempotent. Saving resume position never marks a lesson completed.
        Shares the user-wide completion/resume quota (60/min default), separate from private reads.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lessonId]
              properties:
                lessonId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Resume position saved without altering lesson completion
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LastLessonResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /lessons/{lessonId}/playback:
    get:
      operationId: getLessonPlayback
      tags: [Learning access]
      summary: Issue a short-lived signed Mux playback token
      description: |
        A published preview lesson allows anonymous video playback, never PDF downloads.
        Other published lessons require an active student enrollment. An active approved
        course owner or administrator may review unpublished content without enrollment.
        A supplied invalid Authorization header always returns 401 (no anonymous fallback).
        Tokens expire after at most 900 seconds; renew through this endpoint. Revocation
        prevents new issuance, not the use of a token already issued until its expiry.
        Learning requests share a user-wide quota of 30/min; anonymous previews use 20/min
        per normalized IP. 503 PLAYBACK_PREPARING is retryable with bounded backoff.
        No query parameters are accepted. Tokens must not be logged or persisted as permanent URLs.
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/LessonId' }]
      responses:
        '200':
          description: Signed playback available
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /lessons/{lessonId}/attachments/{assetId}/download:
    get:
      operationId: getLessonAttachmentDownload
      tags: [Learning access]
      summary: Issue a temporary authenticated PDF download URL
      description: |
        Requires an active student enrollment in a published course, or the active approved
        course owner/administrator reviewing its content. Preview flags never grant PDF access.
        The attachment must be ready, authenticated, owned by the course instructor and attached
        to this exact lesson. assetId is a MediaAsset ID, not a provider ID; obtain it from the
        authenticated learning outline. No query parameters are accepted.
        URLs expire after at most 60 seconds. Request a new URL on expiry; never store one permanently.
        Bearer URLs remain usable until expiry after enrollment/session/account revocation.
        Download and playback requests share the same authenticated user quota (30/min).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LessonId' }
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Temporary download available
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateDownloadResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /courses/{courseId}/checkout:
    post:
      operationId: checkoutCourse
      summary: Create or resume Stripe Test checkout for a published paid course
      description: |
        Requires an active verified student. Owners cannot buy their own courses.
        Do not send price, commission, provider IDs, or return URLs. Repeated requests
        reuse the same server-owned order and Checkout session. A 409 PAYMENT_PENDING
        means an attempt is being prepared or awaiting payment confirmation.
        Retry a 503 with the same course, not a new key. PAYMENT_RECONCILIATION_REQUIRED
        preserves the purchase slot until the previous attempt is resolved.
        Stripe-confirmed unpaid expiration or a definitive amount validation rejection
        before allocation allows replacement. Cancel/success
        redirects do not change payment state. Only the durable verified Stripe event worker
        can confirm payment, enroll the buyer, and record pending instructor earnings.
      tags: [Checkout]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: New order and hosted checkout
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '200':
          description: Resumed existing order and checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /courses:
    get:
      operationId: listPublishedCourses
      summary: Browse published courses
      description: |
        Title search is normalized Arabic/English prefix matching, not full-text or fuzzy search.
        Archived categories do not hide already published courses. Draft, pending, rejected,
        and provider-unavailable courses are excluded.
      tags: [Catalog]
      parameters:
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: categoryId
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        - in: query
          name: pricing
          schema: { type: string, enum: [all, free, paid], default: all }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published courses ordered by publication date and ID, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /courses/{slug}:
    get:
      operationId: getPublishedCourseBySlug
      summary: Read published course details and public curriculum
      tags: [Catalog]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1, maxLength: 220 }
      responses:
        '200':
          description: Public course details without media credentials or private attachments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogDetailsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /instructor/courses/{courseId}/submit-review:
    post:
      operationId: submitCourseForReview
      summary: Submit a complete owned draft for administrative review
      tags: [Course review]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '200':
          description: Course moved to pending_review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /instructor/courses/{courseId}/reopen:
    post:
      operationId: reopenCourseForRepair
      summary: Reopen an owned rejected or provider-unavailable course as a draft
      tags: [Course review]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '200':
          description: Course returned to draft; audit history remains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /admin/courses:
    get:
      operationId: listCoursesForReview
      summary: List courses for administrative review
      tags: [Course review]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [draft, pending_review, published, rejected, unavailable], default: pending_review }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated courses ordered by submission time and ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /admin/courses/{courseId}:
    get:
      operationId: getCourseForReview
      summary: Read course content and review history as an admin
      tags: [Course review]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '200':
          description: Review details without private video provider identifiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCourseDetailsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /admin/courses/{courseId}/review:
    patch:
      operationId: reviewCourse
      summary: Approve and publish, or reject, a pending course
      description: |
        Approval atomically rechecks that the instructor is active, approved, and still
        has the instructor role. If eligibility changed after submission, returns
        403 INSTRUCTOR_NOT_APPROVED without publishing or recording an approval.
        An admin can still reject the submission with a reason.
      tags: [Course review]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseReviewDecision' }
      responses:
        '200':
          description: Reviewed course with persisted decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /categories:
    get:
      operationId: listPublicCategories
      summary: List active categories
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Active categories in name and ID order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /admin/categories:
    get:
      operationId: listAdminCategories
      summary: List categories including archived ones
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: isActive
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Categories in name and ID order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      operationId: createCategory
      summary: Create a category with a unique normalized slug
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryInput' }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /admin/categories/{categoryId}:
    patch:
      operationId: updateCategory
      summary: Edit, archive, or reactivate a category without deleting references
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryInput' }
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /media/upload-intents:
    post:
      operationId: createMediaUploadIntent
      summary: Create a signed Cloudinary upload intent for an owned target
      tags: [Media]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, targetId]
              properties:
                purpose: { type: string, enum: [avatar, course_cover, lesson_attachment] }
                targetId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '201':
          description: Signed upload parameters and pending asset ID; upload bytes directly to Cloudinary. The app confirmation deadline is expiresAt; the provider signature may remain valid until providerUploadValidUntil, so canceled/expired uploads are cleaned later.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [assetId, upload, maxBytes]
                    properties:
                      assetId: { type: string }
                      upload:
                        type: object
                        required: [uploadUrl, apiKey, signature, parameters, resourceType, deliveryType, expiresAt, providerUploadValidUntil]
                        properties:
                          uploadUrl: { type: string, format: uri }
                          apiKey: { type: string }
                          signature: { type: string }
                          parameters: { type: object, additionalProperties: true }
                          resourceType: { type: string }
                          deliveryType: { type: string }
                          expiresAt: { type: string, format: date-time }
                          providerUploadValidUntil: { type: string, format: date-time }
                      maxBytes: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /media/{assetId}/confirm:
    post:
      operationId: confirmMediaUpload
      summary: Verify uploaded metadata at Cloudinary and attach media atomically
      tags: [Media]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Verified asset attached to its original target
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      asset: { $ref: '#/components/schemas/MediaAsset' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /media/{assetId}:
    delete:
      operationId: deleteMediaAsset
      summary: Detach an owned asset and queue provider cleanup
      tags: [Media]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '204': { description: Asset detached and deletion queued }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /health:
    get:
      operationId: getHealth
      summary: Report API process health
      tags: [Health]
      responses:
        '200':
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      operationId: registerStudent
      summary: Register a student account and send its verification email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Student account created and verification email accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/EmailDeliveryError'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a one-time token and verify its account email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/resend-verification:
    post:
      operationId: resendEmailVerification
      summary: Queue a replacement verification email
      description: Every valid email request is persisted before responding, without an account lookup or SMTP wait. Background processing sends mail only for active unverified accounts; failed delivery preserves the existing link.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Request durably queued regardless of account existence or verification state; this does not confirm email delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcceptedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/login:
    post:
      operationId: login
      summary: Sign in a verified user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token returned and refresh token set in an HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly refresh_token cookie scoped to /api/v1/auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: Each family permits at most 4096 successful rotations. The next refresh revokes that family and returns 401 INVALID_REFRESH_TOKEN; sign in again. Historical hashes are never evicted while the family remains usable.
      tags: [Auth]
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Session rotated successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Replacement HttpOnly refresh_token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session
      description: Idempotent. A missing cookie is treated as an already-ended session. Requires a trusted request source. Revocation also invalidates this device's access tokens on subsequent requests.
      tags: [Auth]
      security:
        - refreshCookie: []
        - {}
      responses:
        '200':
          description: Current session ended and refresh cookie cleared
          headers:
            Set-Cookie:
              description: Expires the HttpOnly refresh_token cookie at /api/v1/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session belonging to the authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sessions and existing access tokens invalidated
          headers:
            Set-Cookie:
              description: Expires the HttpOnly refresh_token cookie at /api/v1/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Queue a password-reset email without revealing account existence
      description: Every valid email request is persisted before responding. Background processing sends mail only for active accounts.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request durably queued regardless of account existence; this does not confirm delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetAcceptedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Consume a one-time token and set a new password
      description: On success, every existing access and refresh session is invalidated and the refresh cookie is cleared. During replacement email issuance, a still-valid old token returns 409 PASSWORD_RESET_IN_PROGRESS; retry shortly or use the replacement link.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed and all previous sessions invalidated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Clears the HttpOnly refresh_token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: A replacement reset email is being sent (PASSWORD_RESET_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
