      operationId: deleteDraftCourseLesson
      summary: Delete a lesson and compact sibling positions
      tags: [Curriculum]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lesson deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /instructor/lessons/{lessonId}/video-upload:
    parameters:
      - $ref: '#/components/parameters/LessonId'
    post:
      operationId: createLessonVideoDirectUpload
      summary: Create a one-time Mux Direct Upload URL for an owned draft lesson
      description: The browser uploads video bytes directly to Mux. This API never receives the file. A lesson with a ready or in-progress video rejects another attempt.
      tags: [Video]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Direct Upload URL reserved and created
          headers:
            Cache-Control:
              description: Prevents storage of the temporary signed upload URL
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /webhooks/video:
    post:
      operationId: receiveMuxVideoWebhook
      summary: Receive a signed Mux video lifecycle event
      description: Public provider callback. The mux-signature header is verified against the untouched JSON body and a five-minute timestamp window. Duplicate delivery is safe.
      tags: [Video]
      parameters:
        - name: mux-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Mux webhook event; validated after signature verification.
              additionalProperties: true
      responses:
        '200':
          description: Authentic event acknowledged, whether handled or obsolete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoWebhookResponse'
        '400':
          description: Missing, expired, future, or invalid Mux signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      tags: [Checkout]
      summary: Receive a signed Stripe Test Mode event (provider only)
      description: |
        Send the original uncompressed JSON bytes, at most 1 MiB, with Stripe-Signature.
        No JWT or browser/user rate limiter. Test Mode, platform-account snapshot events only.
        Supported types are checkout.session.completed, checkout.session.async_payment_succeeded,
        checkout.session.async_payment_failed, and checkout.session.expired.
        Unsupported valid events are retained as ignored with no financial effects.
        HTTP 200 acknowledges durable receipt, NOT fulfillment. Duplicates never reopen
        processed/failed events. A worker validates current provider evidence and atomically
        confirms Order/Payment, Enrollment, pending EarningEntry, and the event itself.
        Never call this endpoint from the frontend or treat a redirect as payment proof.
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, livemode, created, data]
              properties:
                id: { type: string, pattern: '^evt_', maxLength: 255 }
                type: { type: string, maxLength: 255 }
                livemode: { const: false }
                created: { type: integer, minimum: 1 }
                data:
                  type: object
                  required: [object]
                  properties:
                    object: { type: object }
      responses:
        '200':
          description: Verified event durably stored or already present; processing is asynchronous
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [received]
                    properties:
                      received: { const: true }
        '400':
          description: INVALID_PAYMENT_WEBHOOK_SIGNATURE or INVALID_PAYMENT_EVENT; not stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: PAYMENT_EVENT_CONFLICT; inconsistent existing event identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: PAYLOAD_TOO_LARGE; body exceeds 1 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: UNSUPPORTED_CONTENT_ENCODING; compressed bodies are not supported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Durable persistence failed; Stripe must retry delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /courses/{courseId}/enroll:
    post:
      operationId: enrollFreeCourse
      tags: [Learning library]
      summary: Enroll in a published free course
      description: |
        Active verified student, not the course owner. Send no body or an empty object.
        Creates one active Enrollment with null sourceOrderId, and no financial records or provider calls.
        Existing active access returns 200 unchanged, including after a later price change.
        Revoked access returns ENROLLMENT_REVOKED; it is never silently restored.
        PAID_COURSE_REQUIRES_CHECKOUT and PAYMENT_PENDING are 409 conflicts.
        Quota is ENROLL_RATE_LIMIT_MAX (default 10 per minute), per user across all courses.
        All responses, including errors, use Cache-Control no-store.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: New free enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentResponse' }
        '200':
          description: Already active; same enrollment unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /users/me/courses:
    get:
      operationId: listMyLibrary
      tags: [Learning library]
      summary: List the authenticated student's enrollments
      description: |
        Snapshot-consistent pagination, ordered enrolledAt descending then ID descending.
        Only the current user's records. A nonpublished/deleted course remains a historical
        enrollment with course null and available false, without leaking draft content.
        Each available active enrollment has dynamic current-curriculum progress;
        unavailable/revoked entries have progress null. Zero lessons means zero percent.
        All private reads share PRIVATE_READ_RATE_LIMIT_MAX (default 120 per minute) per user.
        Cache-Control no-store applies to successes and errors.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - in: query
          name: status
          schema: { type: string, enum: [active, revoked, all], default: active }
      responses:
        '200':
          description: Student library; unavailable entries have no course metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /users/me/courses/{courseId}:
    get:
      operationId: getMyLearningCourse
      tags: [Learning library]
      summary: Read the enrolled student's published learning outline
      description: |
        Active own enrollment required; missing/revoked/non-owned enrollment returns 404.
        An unavailable/nonpublished/deleted course returns 409 COURSE_UNAVAILABLE.
        Returns ordered sections/lesson descriptions, media readiness, ready PDF database IDs,
        per-lesson completion and dynamic course progress. Never returns provider IDs,
        playback tokens or private URLs. Invalid/deleted/foreign lastLessonId becomes null.
        Protected playback/downloads use the separate S2-10 endpoints.
        Shared private-read quota and Cache-Control no-store apply.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '200':
          description: Snapshot-consistent learning outline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningCourseResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /users/me/orders:
    get:
      operationId: listMyOrders
      tags: [Orders]
      summary: Read the current student's order history
      description: Immutable title/price snapshots, newest first; shared private-read quota and no-store. Read-only, never calls Stripe or fulfills payments.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/OrderStatus' }
      responses:
        '200':
          description: Paginated own order history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /users/me/orders/{orderId}:
    get:
      operationId: getMyOrder
      tags: [Orders]
      summary: Poll one owned order and its safe payment status
      description: |
        Non-owned/missing order returns the same 404. Order and Payment are read in one snapshot.
        No provider IDs, checkout URLs, email, keys, leases, or financial split are exposed.
        Poll every 5 seconds, back off to 30 seconds and stop after two minutes; then allow manual refresh.
        A timeout does not mean failure and must not start a new checkout. Only the event worker fulfills.
        Shared private-read quota and Cache-Control no-store apply.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Current persisted status only; no side effects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [Orders]
      summary: Read order snapshots as administrator
      description: Admin only, newest first, no financial mutations. Shared private-read quota and no-store.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/OrderStatus' }
        - in: query
          name: studentId
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        - in: query
          name: courseId
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Filtered financial snapshots for administrative review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /admin/orders/{orderId}:
    get:
      operationId: getAdminOrder
      tags: [Orders]
      summary: Read one order and safe payment details as administrator
      description: Admin only; no provider references, customer email, keys or leases. Shared private-read quota and no-store.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Financial split snapshot and safe payment status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderDetailsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    OrderStatus:
      name: status
      in: query
      schema: { type: string, enum: [pending, paid, failed, cancelled, refunded] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  responses:
    ValidationError:
      description: Request data or verification token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: A unique resource already exists or its state no longer permits this transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitError:
      description: Too many requests for the applicable client or authenticated-user quota
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
        RateLimit:
          description: Combined quota information using draft-8 format
          schema:
            type: string
        RateLimit-Policy:
          description: Quota and window policy using draft-8 format
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EmailDeliveryError:
      description: Account was created but email delivery was unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Credentials or session are missing, invalid, expired, or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Account state, role, or request origin does not permit this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLargeError:
      description: Webhook body exceeds the one-megabyte limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailableError:
      description: Mux configuration or service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ProgressSummary:
      type: object
      additionalProperties: false
      required: [totalLessons, completedLessons, percentage, completedAt]
      properties:
        totalLessons: { type: integer, minimum: 0 }
        completedLessons: { type: integer, minimum: 0 }
        percentage: { type: number, minimum: 0, maximum: 100 }
        completedAt:
          type: [string, 'null']
          format: date-time
          description: Latest relevant lesson completion date only when the nonempty current curriculum is complete
    LessonCompletion:
      type: object
      additionalProperties: false
      required: [lessonId, completed, completedAt]
      properties:
        lessonId: { type: string, pattern: '^[a-f0-9]{24}$' }
        completed: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
    ProgressResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [enrollment, progress, lessonProgress]
          properties:
            enrollment: { $ref: '#/components/schemas/Enrollment' }
            progress: { $ref: '#/components/schemas/ProgressSummary' }
            lessonProgress: { $ref: '#/components/schemas/LessonCompletion' }
    LastLessonResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [enrollment, progress]
          properties:
            enrollment: { $ref: '#/components/schemas/Enrollment' }
            progress: { $ref: '#/components/schemas/ProgressSummary' }
    PlaybackResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [playbackId, token, expiresAt]
          properties:
            playbackId: { type: string }
            token: { type: string }
            expiresAt: { type: string, format: date-time }
    PrivateDownloadResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [url, expiresAt]
          properties:
            url: { type: string, format: uri }
            expiresAt: { type: string, format: date-time }
    Enrollment:
      type: object
      additionalProperties: false
      required: [id, courseId, sourceOrderId, status, enrolledAt, completedAt, revokedAt, lastLessonId]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{24}$' }
        courseId: { type: string, pattern: '^[a-f0-9]{24}$' }
        sourceOrderId: { type: [string, 'null'], pattern: '^[a-f0-9]{24}$' }
        status: { type: string, enum: [active, revoked] }
        enrolledAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastLessonId: { type: [string, 'null'], pattern: '^[a-f0-9]{24}$' }
    EnrollmentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [enrollment]
          properties:
            enrollment: { $ref: '#/components/schemas/Enrollment' }
    LibraryCourse:
      type: object
      required: [id, slug, title, shortDescription, level, language, coverUrl]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        shortDescription: { type: string }
        level: { type: [string, 'null'], enum: [beginner, intermediate, advanced, all_levels, null] }
        language: { type: [string, 'null'], enum: [ar, en, null] }
        coverUrl: { type: [string, 'null'], format: uri }
    LibraryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [courses, pagination]
          properties:
            pagination: { $ref: '#/components/schemas/Pagination' }
            courses:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [enrollment, course, available, progress]
                properties:
                  progress:
                    oneOf: [{ $ref: '#/components/schemas/ProgressSummary' }, { type: 'null' }]
                  enrollment: { $ref: '#/components/schemas/Enrollment' }
                  available: { type: boolean }
                  course:
                    oneOf:
                      - allOf: [{ $ref: '#/components/schemas/LibraryCourse' }]
                        unevaluatedProperties: false
                      - { type: 'null' }
    LearningCourse:
      allOf:
        - { $ref: '#/components/schemas/LibraryCourse' }
        - type: object
          required: [description, requirements, learningOutcomes, sections]
          properties:
            description: { type: string }
            requirements: { type: array, items: { type: string } }
            learningOutcomes: { type: array, items: { type: string } }
            sections:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, title, position, lessons]
                properties:
                  id: { type: string }
                  title: { type: string }
                  position: { type: integer, minimum: 0 }
                  lessons:
                    type: array
                    items:
                      $ref: '#/components/schemas/LearningLesson'
      unevaluatedProperties: false
    LearningLesson:
      type: object
      additionalProperties: false
      required: [id, title, description, position, durationSeconds, videoStatus, isPreview, attachments, completed, completedAt]
      properties:
        completed: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
        id: { type: string }
        title: { type: string }
        description: { type: string }
        position: { type: integer, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0 }
        videoStatus: { type: string, enum: [none, pending, processing, ready, failed] }
        isPreview: { type: boolean }
        attachments:
          type: array
          maxItems: 1
          description: Ready private PDF MediaAsset IDs, never provider identifiers or URLs
          items: { type: string, pattern: '^[a-f0-9]{24}$' }
    LearningCourseResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [enrollment, course, progress]
          properties:
            progress: { $ref: '#/components/schemas/ProgressSummary' }
            enrollment: { $ref: '#/components/schemas/Enrollment' }
            course: { $ref: '#/components/schemas/LearningCourse' }
    OrderSnapshot:
      type: object
      required: [id, courseId, courseTitle, amountMinor, currency, status, expiresAt, createdAt, paidAt]
      properties:
        id: { type: string, pattern: '^[a-f0-9]{24}$' }
        courseId: { type: string, pattern: '^[a-f0-9]{24}$' }
        courseTitle: { type: string }
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { const: EGP }
        status: { type: string, enum: [pending, paid, failed, cancelled, refunded] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
    StudentOrder:
      allOf: [{ $ref: '#/components/schemas/OrderSnapshot' }]
      unevaluatedProperties: false
    AdminOrder:
      allOf:
        - { $ref: '#/components/schemas/OrderSnapshot' }
        - type: object
          required: [studentId, instructorId, commissionBps, platformAmountMinor, instructorAmountMinor]
          properties:
            studentId: { type: string }
            instructorId: { type: string }
            commissionBps: { type: integer, minimum: 0, maximum: 10000 }
            platformAmountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
            instructorAmountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
      unevaluatedProperties: false
    PaymentStatus:
      type: object
